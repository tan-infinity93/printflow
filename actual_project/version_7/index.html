<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PrintFlow Screen</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
            rel="stylesheet"
        />
        <link href="index.css" rel="stylesheet" />
        <!-- §11 PWA -->
        <link rel="manifest" href="./manifest.json" />
        <meta name="theme-color" content="#0d6efd" />
    </head>
    <body>
        <div class="app-preview-bg"></div>
        <div class="app-preview-overlay"></div>
        <div class="floating-blur one"></div>
        <div class="floating-blur two"></div>

        <!-- id must NOT be "workspace" — scripts.js uses that id to detect the
             SVG canvas; a collision makes canvas init code run on the login page -->
        <main class="splash-shell" id="splash-shell">
            <div class="splash-card">
                <div class="orbit-wrapper">
                    <div class="orbit-glow"></div>
                    <div class="orbit-ring"></div>

                    <div class="orbit-rotator">
                        <div class="orbit-item one">
                            <div class="orbit-item-inner">
                                <i class="fa-solid fa-print"></i>
                            </div>
                        </div>

                        <div class="orbit-item two">
                            <div class="orbit-item-inner">
                                <i class="fa-regular fa-file-lines"></i>
                            </div>
                        </div>

                        <div class="orbit-item three">
                            <div class="orbit-item-inner">
                                <i class="fa-regular fa-image"></i>
                            </div>
                        </div>
                    </div>

                    <div
                        class="center-core d-flex flex-column align-items-center justify-content-center text-center p-2"
                    >
                        <div class="brand-icon mb-2">
                            <i class="fa-solid fa-layer-group"></i>
                        </div>
                        <div class="fw-bold small text-primary">PrintFlow</div>
                    </div>
                </div>
                <h1 class="brand-title">PrintFlow</h1>
                <p class="brand-subtitle">
                    Loading your print-ready workspace and editor environment.
                </p>
                <div class="loading-row">
                    <div class="loading-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
                <div class="center">
                    <button
                        type="button"
                        class="btn btn-sm btn-outline-info"
                        onclick="showCreateUserModal()"
                    >
                        <i class="fa-solid fa-user-plus me-2"></i>
                        New User
                    </button>
                    <button
                        type="button"
                        class="btn btn-sm btn-outline-primary"
                        onclick="showExistingUserModal()"
                    >
                        <i class="fa-solid fa-user me-2"></i>
                        Existing User
                    </button>
                </div>

                <div class="footer-note">
                    Structured design workflows for print-safe documents
                </div>
            </div>
        </main>
        <div class="modal fade" id="createUserModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered1 modal-sm">
                <div class="modal-content premium-modal">
                    <div class="modal-header border-0 pb-2">
                        <h5 class="modal-title fw-semibold">
                            <i
                                class="fa-solid fa-user-plus me-2 text-primary"
                            ></i>
                            Create App User
                        </h5>
                        <button
                            type="button"
                            class="btn-close premium-close"
                            data-bs-dismiss="modal"
                        ></button>
                    </div>
                    <div class="modal-body pt-1">
                        <div class="mb-3">
                            <label class="form-label premium-label"
                                >Username</label
                            >
                            <input
                                type="text"
                                class="form-control premium-input"
                                id="username"
                                placeholder="Enter username"
                                required
                            />
                        </div>
                        <div class="mb-3">
                            <label class="form-label premium-label"
                                >Password</label
                            >
                            <input
                                type="password"
                                class="form-control premium-input"
                                id="password"
                                placeholder="Enter password"
                                required
                            />
                        </div>
                        <div class="mt-3">
                            <label class="form-label premium-label mb-2"
                                >User Type</label
                            >

                            <div class="premium-radio-group">
                                <label class="premium-radio">
                                    <input
                                        type="radio"
                                        name="userType"
                                        value="appUser"
                                        required
                                    />
                                    <span class="radio-custom"></span>
                                    <span class="radio-text">App User</span>
                                </label>

                                <label class="premium-radio">
                                    <input
                                        type="radio"
                                        name="userType"
                                        value="appAdmin"
                                        required
                                    />
                                    <span class="radio-custom"></span>
                                    <span class="radio-text">Admin User</span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-2">
                        <button
                            type="button"
                            class="btn btn-sm premium-btn1 w-100 btn-outline-primary"
                            onclick="checkAndCreateUser()"
                        >
                            <i class="fa-solid fa-check me-2"></i>
                            Create User
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="existingUserModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered1 modal-sm">
                <div class="modal-content premium-modal">
                    <!-- Header -->
                    <div class="modal-header border-0 pb-2">
                        <h5 class="modal-title fw-semibold">
                            <i
                                class="fa-solid fa-right-to-bracket me-2 text-primary"
                            ></i>
                            Login
                        </h5>
                        <button
                            type="button"
                            class="btn-close premium-close"
                            data-bs-dismiss="modal"
                        ></button>
                    </div>

                    <!-- Body -->
                    <div class="modal-body pt-1">
                        <!-- Username -->
                        <div class="mb-3">
                            <label class="form-label premium-label"
                                >Username</label
                            >
                            <input
                                type="text"
                                class="form-control premium-input"
                                id="loginUsername"
                                placeholder="Enter username"
                                required
                            />
                        </div>

                        <!-- Password -->
                        <div class="mb-2">
                            <label class="form-label premium-label"
                                >Password</label
                            >
                            <input
                                type="password"
                                class="form-control premium-input"
                                id="loginPassword"
                                placeholder="Enter password"
                                required
                            />
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="modal-footer border-0 pt-2">
                        <button
                            type="button"
                            class="btn btn-sm btn-outline-primary premium-btn1 w-100"
                            onclick="loginUser()"
                        >
                            <i
                                class="fa-solid fa-arrow-right-to-bracket me-2"
                            ></i>
                            Login
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Login page only needs the DB helper layer — NOT the full workspace
         scripts.js (canvas, zoom, undo/redo). See shared-db.js header. -->
    <script src="shared-db.js"></script>
    <script>
        const timeOut = 1600;

        window.addEventListener("load", () => {
            requestAnimationFrame(() => {
                document.body.classList.add("loaded");
            });
        });

        // Respect the "Show Splash Screen" app setting — when disabled,
        // reveal the page immediately without waiting for the load animation.
        if (localStorage.getItem("showSplashScreen") === "false") {
            document.addEventListener("DOMContentLoaded", () => {
                document.body.classList.add("loaded");
            });
        }

        const showCreateUserModal = () => {
            const modal = new bootstrap.Modal(
                document.getElementById("createUserModal"),
            );
            modal.show();
        };

        const showExistingUserModal = () => {
            const modal = new bootstrap.Modal(
                document.getElementById("existingUserModal"),
            );
            modal.show();
        };

        /**
         * hashPassword — SHA-256 hash via SubtleCrypto, returns hex string.
         * Passwords are never stored or compared in plain text.
         */
        const hashPassword = async (plainText) => {
            const encoder = new TextEncoder();
            const data = encoder.encode(plainText);
            const hashBuffer = await crypto.subtle.digest("SHA-256", data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map((b) => b.toString(16).padStart(2, "0")).join("");
        };

        const checkAndCreateUser = async () => {
            let username = document.getElementById("username").value.trim();
            let password = document.getElementById("password").value;
            let usertype =
                document.querySelector('input[name="userType"]:checked')
                    ?.value || "";

            if (!username) {
                window.alert("Username cannot be empty");
                return;
            }
            if (!password) {
                window.alert("Password cannot be empty");
                return;
            }
            if (!usertype) {
                window.alert("Please select a user type");
                return;
            }

            const allUsers = await getAllRecordsFromDB("printingUsers");
            for (const existingUser of allUsers) {
                if (existingUser.userType === "appAdmin" && usertype === "appAdmin") {
                    window.alert("Only 1 admin can be created.");
                    return;
                }
                if (existingUser.userName === username) {
                    window.alert("This username already exists. Please choose another.");
                    return;
                }
            }

            const hashedPassword = await hashPassword(password);

            const logRecord = {
                id: crypto.randomUUID(),
                userType: usertype,
                userName: username,
                passWord: hashedPassword,
                timeStamp: new Date().toISOString(),
            };
            await saveRecordToDB(logRecord, "printingUsers");
            window.alert("User created successfully.");

            bootstrap.Modal.getInstance(
                document.getElementById("createUserModal"),
            ).hide();
        };

        const loginUser = async () => {
            let username =
                document.getElementById("loginUsername").value.trim();
            let password =
                document.getElementById("loginPassword").value;

            if (!username) {
                window.alert("Username cannot be empty");
                return;
            }
            if (!password) {
                window.alert("Password cannot be empty");
                return;
            }

            const hashedPassword = await hashPassword(password);

            // checkLoginUser looks up by [username, password] index — pass the hash
            let user = await checkLoginUser(username, hashedPassword);

            if (user && user.userName === username && user.passWord === hashedPassword) {
                document.body.classList.add("fade-out");

                let loggedInUser = {
                    userType: user.userType,
                    id: user.id,
                    userName: user.userName,
                };
                window.sessionStorage.setItem("loggedInUser", JSON.stringify(loggedInUser));
                // Also persist in localStorage — sessionStorage is per-tab and
                // wiped by Reset App Settings, which left the navbar showing "?"
                window.localStorage.setItem("loggedInUser", JSON.stringify(loggedInUser));

                setTimeout(() => {
                    window.location.href = "workspace.html";
                }, 420);
            } else {
                window.alert("Incorrect username or password, or user does not exist.");
            }
        };
    </script>
</html>

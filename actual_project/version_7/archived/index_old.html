<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrintFlow Splash</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Font Awesome Free -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --primary: #0d6efd;
      --primary-2: #2d6efd;
      --accent: #0bbcd6;

      --text-main: #111827;
      --text-soft: #4b5563;
      --text-faint: #6b7280;

      --glass: rgba(255, 255, 255, 0.28);
      --glass-strong: rgba(255, 255, 255, 0.42);
      --glass-border: rgba(255, 255, 255, 0.42);
      --glass-blue-border: rgba(13, 110, 253, 0.10);

      --shadow-soft: 0 16px 40px rgba(13, 110, 253, 0.08);
      --shadow-strong: 0 24px 60px rgba(13, 110, 253, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #eef5ff;
      color: var(--text-main);
      position: relative;
    }

    /* ===== Full Background App Preview ===== */
    .app-preview-bg {
      position: absolute;
      inset: 0;
      background-image: url("your-app-preview.jpg"); /* replace */
      background-size: cover;
      background-position: center;
      transform: scale(1.035);
      filter: blur(8px) saturate(1.04) brightness(0.92);
      z-index: 0;
    }

    .app-preview-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 18%, rgba(13, 110, 253, 0.10), transparent 22%),
        radial-gradient(circle at 82% 28%, rgba(11, 188, 214, 0.10), transparent 24%),
        radial-gradient(circle at 50% 82%, rgba(45, 110, 253, 0.06), transparent 20%),
        linear-gradient(
          135deg,
          rgba(255,255,255,0.42),
          rgba(255,255,255,0.30),
          rgba(245,247,250,0.34)
        );
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      z-index: 1;
    }

    .floating-blur {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      z-index: 1;
      pointer-events: none;
    }

    .floating-blur.one {
      background: #0d6efd;
      top: -40px;
      left: -30px;
    }

    .floating-blur.two {
      background: #0bbcd6;
      right: -40px;
      bottom: -40px;
    }

    /* ===== Main Splash Layout ===== */
    .splash-shell {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .splash-card {
      width: min(100%, 370px);
      background: rgba(255, 255, 255, 0.30);
      border: 1px solid rgba(255, 255, 255, 0.46);
      border-radius: 30px;
      padding: 26px 22px 22px;
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow:
        0 18px 60px rgba(13, 110, 253, 0.10),
        inset 0 1px 0 rgba(255,255,255,0.50);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .splash-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.22),
          transparent 34%,
          rgba(13,110,253,0.03) 100%
        );
      pointer-events: none;
    }

    .mini-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.48);
      border: 1px solid rgba(13, 110, 253, 0.08);
      color: var(--primary);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      box-shadow: 0 8px 18px rgba(13,110,253,0.05);
      margin-bottom: 14px;
      letter-spacing: 0.01em;
    }

    /* ===== Orbit ===== */
    .orbit-wrapper {
      width: 200px;
      aspect-ratio: 1 / 1;
      position: relative;
      margin: 0 auto 18px;
    }

    .orbit-glow {
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(13, 110, 253, 0.16), transparent 65%);
      filter: blur(18px);
      z-index: 0;
    }

    .orbit-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px dashed rgba(13, 110, 253, 0.22);
      z-index: 1;
      box-shadow:
        0 0 0 1px rgba(13, 110, 253, 0.03) inset,
        0 0 40px rgba(13, 110, 253, 0.04);
    }

    .orbit-rotator {
      position: absolute;
      inset: 0;
      z-index: 2;
      animation: spin 14s linear infinite;
      transform-origin: center center;
      will-change: transform;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .orbit-item {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 52px;
      height: 52px;
      margin-left: -26px;
      margin-top: -26px;
      border-radius: 50%;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(13, 110, 253, 0.10);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 10px 24px rgba(13,110,253,0.08),
        0 0 20px rgba(255,255,255,0.08) inset;
    }

    .orbit-item i {
      font-size: 1.1rem;
      color: var(--primary);
      text-shadow: 0 0 20px rgba(13, 110, 253, 0.08);
    }

    .orbit-item.one {
      transform: translateY(-84px);
    }

    .orbit-item.two {
      transform: rotate(120deg) translateY(-84px) rotate(-120deg);
    }

    .orbit-item.three {
      transform: rotate(240deg) translateY(-84px) rotate(-240deg);
    }

    .orbit-item-inner {
      animation: counterSpin 14s linear infinite;
      will-change: transform;
    }

    @keyframes counterSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    .center-core {
      position: absolute;
      inset: 50%;
      width: 98px;
      height: 98px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 3;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.98), rgba(255,255,255,0.78)),
        linear-gradient(135deg, rgba(13,110,253,0.08), rgba(11,188,214,0.10));
      border: 1px solid rgba(13,110,253,0.10);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        0 16px 40px rgba(13,110,253,0.08),
        0 0 40px rgba(13, 110, 253, 0.05);
    }

    .center-core .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(13,110,253,0.08);
      border: 1px solid rgba(13,110,253,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 14px rgba(13,110,253,0.02);
    }

    .center-core .brand-icon i {
      font-size: 1rem;
      color: var(--primary);
    }

    .brand-title {
      font-size: clamp(1.55rem, 2.6vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .brand-subtitle {
      color: var(--text-soft);
      font-size: 0.93rem;
      line-height: 1.65;
      max-width: 290px;
      margin: 0 auto 16px;
    }

    .loading-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: var(--text-soft);
      font-weight: 600;
      font-size: 0.88rem;
      margin-bottom: 16px;
    }

    .loading-dots {
      display: inline-flex;
      gap: 5px;
      align-items: center;
    }

    .loading-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: inline-block;
      animation: bounceDots 1.2s infinite ease-in-out;
      opacity: 0.75;
    }

    .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounceDots {
      0%, 80%, 100% {
        transform: scale(0.85);
        opacity: 0.5;
      }
      40% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    .enter-btn {
      border-radius: 999px;
      padding: 0.8rem 1.35rem;
      font-weight: 700;
      font-size: 0.94rem;
      border: none;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 10px 30px rgba(13, 110, 253, 0.16);
      transition: all 0.25s ease;
    }

    .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(13, 110, 253, 0.22);
      color: #fff;
    }

    .footer-note {
      margin-top: 14px;
      font-size: 0.76rem;
      color: var(--text-faint);
      letter-spacing: 0.01em;
    }

    @media (max-width: 575.98px) {
      .splash-card {
        width: min(100%, 340px);
        border-radius: 26px;
        padding: 24px 18px 20px;
      }

      .orbit-wrapper {
        width: 184px;
      }

      .orbit-item.one {
        transform: translateY(-77px);
      }

      .orbit-item.two {
        transform: rotate(120deg) translateY(-77px) rotate(-120deg);
      }

      .orbit-item.three {
        transform: rotate(240deg) translateY(-77px) rotate(-240deg);
      }

      .center-core {
        width: 92px;
        height: 92px;
      }
    }
  </style>
</head>
<body>
  <div class="app-preview-bg"></div>
  <div class="app-preview-overlay"></div>
  <div class="floating-blur one"></div>
  <div class="floating-blur two"></div>

  <main class="splash-shell">
    <div class="splash-card">
      <div class="mini-badge">
        <i class="fa-solid fa-sparkles"></i>
        Initializing Workspace
      </div>

      <div class="orbit-wrapper">
        <div class="orbit-glow"></div>
        <div class="orbit-ring"></div>

        <div class="orbit-rotator">
          <div class="orbit-item one">
            <div class="orbit-item-inner">
              <i class="fa-solid fa-print"></i>
            </div>
          </div>

          <div class="orbit-item two">
            <div class="orbit-item-inner">
              <i class="fa-regular fa-file-lines"></i>
            </div>
          </div>

          <div class="orbit-item three">
            <div class="orbit-item-inner">
              <i class="fa-regular fa-image"></i>
            </div>
          </div>
        </div>

        <div class="center-core d-flex flex-column align-items-center justify-content-center text-center p-2">
          <div class="brand-icon mb-2">
            <i class="fa-solid fa-layer-group"></i>
          </div>
          <div class="fw-bold small text-primary">PrintFlow</div>
        </div>
      </div>

      <h1 class="brand-title">PrintFlow</h1>
      <p class="brand-subtitle">
        Loading your print-ready workspace and editor environment.
      </p>

      <div class="loading-row">
        <span>Preparing app</span>
        <div class="loading-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <a href="index.html" class="btn enter-btn">
        <i class="fa-solid fa-arrow-right me-2"></i>
        Enter App
      </a>

      <div class="footer-note">
        Structured design workflows for print-safe documents
      </div>
    </div>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PrintFlow Splash</title>

        <!-- Bootstrap 5 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <!-- Font Awesome Free -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        />

        <!-- Google Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />

        <style>
            :root {
                --bg-main: #f1f3f5;
                --bg-soft: #f0f5f5;
                --bg-white: #ffffff;
                --surface: rgba(255, 255, 255, 0.22);
                --surface-strong: rgba(255, 255, 255, 0.35);
                --border-soft: rgba(13, 110, 253, 0.12);
                --border-strong: rgba(13, 110, 253, 0.22);

                --primary: #0d6efd;
                --primary-2: #2d6efd;
                --accent: #0bbcd6;

                --text-main: #111827;
                --text-soft: #495057;
                --text-faint: #6c757d;

                --shadow-soft: 0 10px 30px rgba(13, 110, 253, 0.1);
                --shadow-strong: 0 18px 50px rgba(13, 110, 253, 0.16);
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                min-height: 100%;
                font-family:
                    Inter,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
            }

            body {
                min-height: 100vh;
                overflow: hidden;
                background: #eaf3ff;
                color: var(--text-main);
                position: relative;
            }

            /* ===== Full Background App Preview ===== */
            .app-preview-bg {
                position: absolute;
                inset: 0;
                background-image: url("your-app-preview.jpg"); /* replace with your screenshot */
                background-size: cover;
                background-position: center;
                transform: scale(1.04);
                filter: blur(6px) saturate(1.08) brightness(0.82);
                z-index: 0;
            }

            .app-preview-overlay {
                position: absolute;
                inset: 0;
                background:
                    radial-gradient(
                        circle at 20% 20%,
                        rgba(13, 110, 253, 0.12),
                        transparent 22%
                    ),
                    radial-gradient(
                        circle at 80% 30%,
                        rgba(11, 188, 214, 0.12),
                        transparent 24%
                    ),
                    radial-gradient(
                        circle at 50% 80%,
                        rgba(45, 110, 253, 0.08),
                        transparent 20%
                    ),
                    linear-gradient(
                        135deg,
                        rgba(255, 255, 255, 0.22),
                        rgba(255, 255, 255, 0.16),
                        rgba(241, 243, 245, 0.22)
                    );
                backdrop-filter: blur(2px);
                -webkit-backdrop-filter: blur(2px);
                z-index: 1;
            }

            .floating-blur {
                position: absolute;
                width: 280px;
                height: 280px;
                border-radius: 50%;
                filter: blur(80px);
                opacity: 0.18;
                z-index: 1;
                pointer-events: none;
            }

            .floating-blur.one {
                background: #0d6efd;
                top: -40px;
                left: -40px;
            }

            .floating-blur.two {
                background: #0bbcd6;
                right: -50px;
                bottom: -50px;
            }

            /* ===== Main Splash Layout ===== */
            .splash-shell {
                position: relative;
                z-index: 2;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .splash-card {
                width: min(100%, 520px);
                background: rgba(255, 255, 255, 0.24);
                border: 1px solid rgba(255, 255, 255, 0.34);
                border-radius: 34px;
                padding: 34px 28px;
                backdrop-filter: blur(22px) saturate(180%);
                -webkit-backdrop-filter: blur(22px) saturate(180%);
                box-shadow:
                    0 20px 60px rgba(13, 110, 253, 0.1),
                    inset 0 1px 0 rgba(255, 255, 255, 0.35);
                text-align: center;
                position: relative;
                overflow: hidden;
            }

            .splash-card::before {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.18),
                    transparent 35%,
                    rgba(13, 110, 253, 0.04) 100%
                );
                pointer-events: none;
            }

            .mini-badge {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                background: rgba(255, 255, 255, 0.44);
                border: 1px solid rgba(13, 110, 253, 0.1);
                color: var(--primary);
                padding: 8px 14px;
                border-radius: 999px;
                font-size: 0.85rem;
                font-weight: 600;
                box-shadow: 0 8px 18px rgba(13, 110, 253, 0.06);
                margin-bottom: 18px;
            }

            /* ===== Orbit ===== */
            .orbit-wrapper {
                width: min(76vw, 280px);
                aspect-ratio: 1 / 1;
                position: relative;
                margin: 0 auto 22px;
            }

            .orbit-glow {
                position: absolute;
                inset: 18%;
                border-radius: 50%;
                background: radial-gradient(
                    circle,
                    rgba(13, 110, 253, 0.16),
                    transparent 65%
                );
                filter: blur(20px);
                z-index: 0;
            }

            .orbit-ring {
                position: absolute;
                inset: 0;
                border-radius: 50%;
                border: 1px dashed rgba(13, 110, 253, 0.24);
                z-index: 1;
                box-shadow:
                    0 0 0 1px rgba(13, 110, 253, 0.03) inset,
                    0 0 40px rgba(13, 110, 253, 0.05);
            }

            .orbit-rotator {
                position: absolute;
                inset: 0;
                z-index: 2;
                animation: spin 14s linear infinite;
                transform-origin: center center;
                will-change: transform;
            }

            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }

            .orbit-item {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 64px;
                height: 64px;
                margin-left: -32px;
                margin-top: -32px;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.62);
                border: 1px solid rgba(13, 110, 253, 0.12);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow:
                    0 12px 30px rgba(13, 110, 253, 0.1),
                    0 0 20px rgba(255, 255, 255, 0.08) inset;
            }

            .orbit-item i {
                font-size: 1.35rem;
                color: var(--primary);
                text-shadow: 0 0 20px rgba(13, 110, 253, 0.08);
            }

            .orbit-item.one {
                transform: translateY(-118px);
            }

            .orbit-item.two {
                transform: rotate(120deg) translateY(-118px) rotate(-120deg);
            }

            .orbit-item.three {
                transform: rotate(240deg) translateY(-118px) rotate(-240deg);
            }

            .orbit-item-inner {
                animation: counterSpin 14s linear infinite;
                will-change: transform;
            }

            @keyframes counterSpin {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(-360deg);
                }
            }

            .center-core {
                position: absolute;
                inset: 50%;
                width: 128px;
                height: 128px;
                transform: translate(-50%, -50%);
                border-radius: 50%;
                z-index: 3;
                background:
                    radial-gradient(
                        circle at 30% 30%,
                        rgba(255, 255, 255, 0.95),
                        rgba(255, 255, 255, 0.75)
                    ),
                    linear-gradient(
                        135deg,
                        rgba(13, 110, 253, 0.08),
                        rgba(11, 188, 214, 0.1)
                    );
                border: 1px solid rgba(13, 110, 253, 0.12);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                box-shadow:
                    0 20px 50px rgba(13, 110, 253, 0.1),
                    0 0 60px rgba(13, 110, 253, 0.06);
            }

            .center-core .brand-icon {
                width: 50px;
                height: 50px;
                border-radius: 50%;
                background: rgba(13, 110, 253, 0.08);
                border: 1px solid rgba(13, 110, 253, 0.1);
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: inset 0 0 18px rgba(13, 110, 253, 0.03);
            }

            .center-core .brand-icon i {
                font-size: 1.2rem;
                color: var(--primary);
            }

            .brand-title {
                font-size: clamp(1.8rem, 3vw, 2.4rem);
                font-weight: 800;
                letter-spacing: -0.03em;
                margin-bottom: 8px;
                color: var(--text-main);
            }

            .brand-subtitle {
                color: var(--text-soft);
                font-size: 1rem;
                line-height: 1.7;
                max-width: 360px;
                margin: 0 auto 20px;
            }

            .loading-row {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                color: var(--text-soft);
                font-weight: 600;
                font-size: 0.95rem;
                margin-bottom: 20px;
            }

            .loading-dots {
                display: inline-flex;
                gap: 5px;
                align-items: center;
            }

            .loading-dots span {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: linear-gradient(
                    135deg,
                    var(--primary),
                    var(--accent)
                );
                display: inline-block;
                animation: bounceDots 1.2s infinite ease-in-out;
                opacity: 0.75;
            }

            .loading-dots span:nth-child(2) {
                animation-delay: 0.15s;
            }

            .loading-dots span:nth-child(3) {
                animation-delay: 0.3s;
            }

            @keyframes bounceDots {
                0%,
                80%,
                100% {
                    transform: scale(0.85);
                    opacity: 0.5;
                }
                40% {
                    transform: scale(1.15);
                    opacity: 1;
                }
            }

            .enter-btn {
                border-radius: 999px;
                padding: 0.85rem 1.5rem;
                font-weight: 700;
                border: none;
                color: #fff;
                background: linear-gradient(
                    135deg,
                    var(--primary),
                    var(--accent)
                );
                box-shadow: 0 10px 30px rgba(13, 110, 253, 0.18);
                transition: all 0.25s ease;
            }

            .enter-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 16px 40px rgba(13, 110, 253, 0.24);
                color: #fff;
            }

            .footer-note {
                margin-top: 18px;
                font-size: 0.82rem;
                color: var(--text-faint);
            }

            @media (max-width: 575.98px) {
                .splash-card {
                    border-radius: 28px;
                    padding: 28px 20px;
                }

                .orbit-wrapper {
                    width: 250px;
                }

                .orbit-item.one {
                    transform: translateY(-105px);
                }

                .orbit-item.two {
                    transform: rotate(120deg) translateY(-105px) rotate(-120deg);
                }

                .orbit-item.three {
                    transform: rotate(240deg) translateY(-105px) rotate(-240deg);
                }

                .center-core {
                    width: 116px;
                    height: 116px;
                }
            }
        </style>
    </head>
    <body>
        <!-- Background preview -->
        <div class="app-preview-bg"></div>
        <div class="app-preview-overlay"></div>
        <div class="floating-blur one"></div>
        <div class="floating-blur two"></div>

        <!-- Splash -->
        <main class="splash-shell">
            <div class="splash-card">
                <div class="mini-badge">
                    <i class="fa-solid fa-sparkles"></i>
                    Initializing Workspace
                </div>

                <div class="orbit-wrapper">
                    <div class="orbit-glow"></div>
                    <div class="orbit-ring"></div>

                    <div class="orbit-rotator">
                        <div class="orbit-item one">
                            <div class="orbit-item-inner">
                                <i class="fa-solid fa-print"></i>
                            </div>
                        </div>

                        <div class="orbit-item two">
                            <div class="orbit-item-inner">
                                <i class="fa-regular fa-file-lines"></i>
                            </div>
                        </div>

                        <div class="orbit-item three">
                            <div class="orbit-item-inner">
                                <i class="fa-regular fa-image"></i>
                            </div>
                        </div>
                    </div>

                    <div
                        class="center-core d-flex flex-column align-items-center justify-content-center text-center p-2"
                    >
                        <div class="brand-icon mb-2">
                            <i class="fa-solid fa-layer-group"></i>
                        </div>
                        <div class="fw-bold small text-primary">PrintFlow</div>
                    </div>
                </div>

                <h1 class="brand-title">PrintFlow</h1>
                <p class="brand-subtitle">
                    Loading your print-ready workspace, templates and editor
                    environment.
                </p>

                <div class="loading-row">
                    <span>Preparing app</span>
                    <div class="loading-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>

                <a href="index.html" class="btn enter-btn">
                    <i class="fa-solid fa-arrow-right me-2"></i>
                    Enter App
                </a>

                <div class="footer-note">
                    Structured design workflows for print-safe documents
                </div>
            </div>
        </main>
    </body>
    <script>
        // setTimeout(() => {
        //     window.location.href = "index.html";
        // }, 2500);
    </script>
</html>

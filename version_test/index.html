<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Print Grid Demo</title>

        <!-- Bootstrap 5 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <style>
            /* ---------------- PRINT SETUP ---------------- */
            @page {
                size: A4;
                margin: 0;
            }

            body {
                background: #f1f3f5;
                padding: 20px;
            }

            /* ---------------- PAGE ---------------- */
            .print-page {
                position: relative;
                width: 210mm;
                height: 297mm;
                background: white;
                margin: auto;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
                overflow: hidden;
            }

            /* ---------------- GRID (PREVIEW ONLY) ---------------- */
            .grid {
                position: absolute;
                inset: 0;
                background-image:
                    linear-gradient(
                        to right,
                        rgba(0, 0, 0, 0.15) 0.2mm,
                        transparent 0.2mm
                    ),
                    linear-gradient(
                        to bottom,
                        rgba(0, 0, 0, 0.15) 0.2mm,
                        transparent 0.2mm
                    );
                background-size: 10mm 10mm;
                pointer-events: none;
            }

            .hide-grid .grid {
                display: none;
            }

            /* ---------------- DRAGGABLE BLOCK ---------------- */
            .draggable {
                position: absolute;
                width: 80mm;
                height: 40mm;
                top: 50mm;
                left: 30mm;
                cursor: move;
            }

            /* ---------------- PRINT RULE ---------------- */
            @media print {
                body {
                    background: none;
                    padding: 0;
                }

                .no-print {
                    display: none;
                }

                .print-page {
                    box-shadow: none;
                }

                .grid {
                    display: none !important;
                }
            }
        </style>
    </head>

    <body>
        <!-- CONTROLS -->
        <div class="text-center mb-3 no-print">
            <button class="btn btn-primary me-2" onclick="toggleGrid()">
                Toggle Grid
            </button>
            <button class="btn btn-success" onclick="printPage()">Print</button>
        </div>

        <!-- PAGE -->
        <div id="page" class="print-page">
            <!-- GRID -->
            <div class="grid"></div>

            <!-- DRAGGABLE CONTENT -->
            <div id="box" class="draggable card text-center shadow-sm">
                <div class="card-body p-2">
                    <strong>Move Me</strong><br />
                    (Address / Logo)
                </div>
            </div>
        </div>

        <!-- JS -->
        <script>
            const box = document.getElementById("box");
            const page = document.getElementById("page");

            let isDragging = false;
            let offsetX = 0;
            let offsetY = 0;

            box.addEventListener("mousedown", (e) => {
                isDragging = true;
                offsetX = e.offsetX;
                offsetY = e.offsetY;
            });

            document.addEventListener("mousemove", (e) => {
                if (!isDragging) return;

                const rect = page.getBoundingClientRect();
                box.style.left = `${e.clientX - rect.left - offsetX}px`;
                box.style.top = `${e.clientY - rect.top - offsetY}px`;
            });

            document.addEventListener("mouseup", () => {
                isDragging = false;
            });

            function toggleGrid() {
                page.classList.toggle("hide-grid");
            }

            function printPage() {
                page.classList.add("hide-grid");
                window.print();
                page.classList.remove("hide-grid");
            }
        </script>
    </body>
</html>
